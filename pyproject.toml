[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fracture-recovery"
version = "0.1.0"
description = "Evidence-based recovery tests for LangGraph workflows"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [{name = "Shanyu Gowdu"}]
dependencies = [
  "langgraph==1.2.11",
  "langgraph-checkpoint-sqlite==3.1.1",
  "pydantic==2.13.5",
  "typer>=0.16,<1",
  "rich>=14,<15",
]

[project.urls]
Repository = "https://github.com/gowdu0/fracture"

[project.scripts]
fracture = "fracture.cli:app"

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.12,<1", "mypy>=1.16,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/fracture"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src/fracture"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true


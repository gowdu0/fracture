name: Recovery tests

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          enable-cache: true
      - run: uv sync --frozen --python ${{ matrix.python }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run fracture demo --output artifacts/ci-demo
      - run: uv run fracture replay artifacts/ci-demo/approved_change/replay.json --output artifacts/ci-replay
      - run: uv run pytest examples/test_existing_workflow.py
      - run: uv build
      - run: uv run python scripts/check_reproducible.py
      - name: Verify metadata and clean wheel/sdist installations without Git
        run: uv run python scripts/check_release.py --output artifacts/install-check
      - name: Audit locked and resolved runtime dependencies
        run: uv run python scripts/audit_runtime.py --output artifacts/audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.os }}-${{ matrix.python }}
          path: |
            artifacts/
            dist/
          retention-days: 7
